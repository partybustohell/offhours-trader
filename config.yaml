mode: paper
live_trading_acknowledged: false
universe:
  nominations_per_agent: 7   # raised 2026-07-27 (sample-rate push: more shots on goal)
  max_candidates: 25         # raised 2026-07-27 (sample-rate push)
  # Verdict round runs in chunks of <= this many candidates per LLM call
  # (2026-07-28): the single-call form saturated its 16k output cap from ~18
  # candidates (900 tokens/candidate), silently re-opening the 2026-07-27
  # truncation incident once max_candidates rose to 25. 8 * 900 = 7.2k per
  # call; chunks run sequentially per analyst so concurrency is unchanged.
  verdict_chunk_size: 8
  min_price: 5
  # CONSOLIDATED dollar volume since 2026-07-27: daily bars now follow
  # data_feed (SIP), so volume is full-tape. Under the old hardcoded IEX bars
  # this floor was computed on single-venue volume (~2-3% of tape) and behaved
  # like a ~$0.7-1B consolidated floor. $50M consolidated keeps real liquidity
  # while widening the universe far beyond the accidental mega-cap filter.
  min_avg_dollar_volume: 50000000
  exclude: []
  # Catalyst-first sourcing (2026-07-27, registry row earnings-scan-2026-07-27):
  # today's post-close + tomorrow's pre-open scheduled reporters go into the
  # fundamental/sentiment/bear scans, so the panel is early to catalysts
  # instead of late to their reactions. Fail-open on calendar outage.
  earnings_scan:
    enabled: true
  # Verdict round reads the stripped article BODY, not just headline+summary
  # (guidance language is where the panel can out-read keyword scanners).
  news_content:
    enabled: true
    max_chars: 1500
sessions:
  premarket: true       # re-enabled 2026-07-14 (SIP feed now covers off-hours)
  afterhours: true      # re-enabled 2026-07-14 (SIP feed now covers off-hours)
  regularhours: true    # regular session 09:30-16:00; opt-in, works on free IEX feed
agent_weights:
  fundamental: 1
  technical: 0.8
  macro: 0.6
  sentiment: 1
  bear: 1.2
# Lowered 0.55 -> 0.50 on 2026-07-27 as part of the sample-rate push: at ~0.7
# trades/week the 50-trade governance gate (min_trades_for_economic_claim)
# takes ~70 weeks to clear, so the evaluation loop could never converge. The
# paper account optimizes for INFORMATION rate, not P&L: per-trade size is
# halved below (max_position_pct / max_order_notional_usd) so total risk stays
# roughly constant while trade count targets 3-5/week. Measure for 2 weeks and
# nudge +/-0.02 as needed. (History: 0.55 came from the Jan-Jun 2026 rev2
# sweep; parity-rth-iex-rthsim measured ~0.7 closed trades/week on the deployed
# path. No positive edge is established at any threshold — paper soak is the
# test. See REPORT.md R3.4.)
conviction_threshold: 0.50
quorum: 3
min_agreeing: 2
max_position_pct: 2.5     # halved 2026-07-27 (sample-rate push: half size, ~2x trades)
max_daily_deploy_pct: 10
# Deploy-budget ordering + concentration (deterministic sizing discipline).
# The executor funds thesis entries in array order until the deploy cap binds,
# so ordering decides which names get funded first.
deploy_priority: conviction    # conviction | conviction_per_risk (÷ realized vol)
min_position_notional_usd: 125 # drop sub-floor positions (whole-share dust).
                               # Halved 2026-07-27 with the per-trade size cut
                               # so the floor doesn't silently eat the smaller
                               # positions. NOTE: sizing base = min(order cap,
                               # equity·pos%); scale with account size.
max_open_names: 8              # cap entries per thesis, best-conviction first.
                               # Raised to 8 on 2026-07-27 (sample-rate push).
                               # Coherent: 8 × max_position_pct 2.5% = 20% <=
                               # max_gross_exposure_pct 25%, so the name cap is
                               # actually reachable (not shadowed by gross).
# Cross-day exposure backstops (entries only), above the per-day deploy cap.
# gross = total book ceiling (= max_open_names full-size names). Raised to hold
# the ~$20k (20% of equity) starter basket with a little headroom; net == gross
# so an all-long basket isn't blocked by a tighter directional cap.
max_gross_exposure_pct: 25
max_net_exposure_pct: 25
# Entries-only intraday timing blackout (wall-clock; feed-independent; exits
# are never gated). Avoids the RTH open/close spikes and the deep-premarket /
# late-afterhours liquidity vacuum.
entry_blackout:
  rth_open_min: 10             # skip the first N min of RTH (09:30–09:40)
  rth_close_min: 10            # skip the last N min before the close (15:50–16:00)
  premarket_start_hm: "08:00"  # no premarket entries before this ET time
  afterhours_end_hm: "18:00"   # no afterhours entries at/after this ET time
# Entries-only blackout around scheduled binary macro prints (exits never
# gated). Static ET calendar — refresh from bls.gov + federalreserve.gov as
# schedules publish (see docs/RUNBOOK.md). Added 2026-07-15 after the June-CPI
# review: the executor could otherwise enter premarket positions minutes
# before an 08:30 print on a thesis formed at 17:00 the prior evening.
# Dates below verified against the primary sources 2026-07-20.
macro_event_blackout:
  enabled: true
  pre_min: 30
  post_min: 15
  events:
    - { date: "2026-07-29", hm: "14:00", label: "FOMC statement" }
    - { date: "2026-08-07", hm: "08:30", label: "Nonfarm payrolls" }
    - { date: "2026-08-12", hm: "08:30", label: "CPI" }
    - { date: "2026-09-04", hm: "08:30", label: "Nonfarm payrolls" }
    - { date: "2026-09-11", hm: "08:30", label: "CPI" }
    - { date: "2026-09-16", hm: "14:00", label: "FOMC statement" }
    - { date: "2026-10-02", hm: "08:30", label: "Nonfarm payrolls" }
    - { date: "2026-10-14", hm: "08:30", label: "CPI" }
    - { date: "2026-10-28", hm: "14:00", label: "FOMC statement" }
    - { date: "2026-11-06", hm: "08:30", label: "Nonfarm payrolls" }
    - { date: "2026-11-10", hm: "08:30", label: "CPI" }
    - { date: "2026-12-04", hm: "08:30", label: "Nonfarm payrolls" }
    - { date: "2026-12-09", hm: "14:00", label: "FOMC statement" }
    - { date: "2026-12-10", hm: "08:30", label: "CPI" }
target_vol_pct: 40          # risk-parity sizing reference (annualized vol %)
max_position_loss_pct: 8    # per-position hard stop, checked each tick
exit_engine:
  enabled: true
  # Default trailing policy for EVERY position (orphans included; an
  # entry-carried LLM trail overrides): >= 5% peak gain arms both the
  # breakeven floor and a 4% trail off the favorable peak. The two-tier +1%
  # breakeven arm was REMOVED 2026-07-27: +1% is inside one daily sigma for
  # the ~40%-vol names this desk trades, so it force-scratched winners on
  # noise (entered at ask, scratched at bid = realized -spread each time).
  trail:
    activate_pct: 5
    trail_pct: 4
    breakeven_floor: true
  # Converge a resting GTC broker stop to the trail floor every tick so the
  # protection survives an engine outage. Never enable in backtest configs.
  native_stop_ratchet:
    enabled: true
  # Trail-family exits (trail retrace / breakeven floor) need the trigger on 2
  # consecutive ticks AND an exit-side displayed size >= 100 before firing —
  # one thin off-hours bid flicker must not liquidate a position into itself.
  # hard_stop / invalidation / target / time_stop are never debounced.
  trail_debounce:
    confirm_ticks: 2
    min_exit_top_size: 100
  # Peak-ratchet data-quality gate (2026-07-28): a quote only advances the
  # persisted favorable peak when the displayed size behind the mark is >= 100
  # (same unit and level as the trail debounce). The peak never decays, so one
  # junk off-hours print would otherwise poison the trail retrace and the GTC
  # stop level permanently. Crossed books are dropped unconditionally upstream.
  peak_sanity:
    min_top_size: 100
max_order_notional_usd: 1000  # halved 2026-07-27 (sample-rate push)
max_spread_bps: 50      # flat fallback; superseded by execution.gates_by_session on SIP
data_feed: sip          # sip (paid, subscribed 2026-07-14): real consolidated NBBO. iex = free single-venue, unrepresentative spreads that trip the spread gate. Since 2026-07-27 daily BARS also follow this feed (consolidated volume).
max_quote_age_sec: 120  # reject quotes older than this — fail closed, never trade a stale book
max_chase_pct: 1
max_drop_pct: 3
# Execution hygiene, enabled 2026-07-27. These are cost controls, not alpha
# signals: the marketable-both-ways default paid the spread on every round
# trip by construction. All down-only / fail-closed.
execution:
  cost_scalar:
    enabled: true            # shrink size as live spread eats the edge (floor 0.5, 45bps ref)
  participation:
    enabled: true            # cap qty at 25% of displayed take-side size
  # Rest halfway inside the spread instead of crossing it. Fills become
  # less certain (an unfilled entry is re-evaluated next tick, no chasing);
  # that trade-off is the point — stop donating the spread.
  entry_aggressiveness: 0.5
  gates_by_session:
    enabled: true            # SIP-only session-calibrated spread/age/size gates (rth 20bps, pre/ah 80bps)
  # Own-earnings guard (entries only; exits never gated): don't OPEN a position
  # on a name reporting within 2 days — holding into the print is the largest
  # single gap risk a position faces. Held positions reporting within 1 day get
  # an earnings_warning audit (visibility; no forced flatten). Fails open.
  earnings_guard:
    enabled: true
    block_days_ahead: 2
# Re-entry cooldown: never re-buy a name the same day it was exited/stopped.
entry_cooldown_after_exit: true
# Cache judge decisions on (entry, headlines, position side) — unchanged
# inputs return the cached decision instead of re-rolling the LLM every tick.
# Also acts as the decline cooldown; cuts judge calls ~10x.
judge_cache:
  enabled: true
daily_loss_halt_pct: 3
executor_interval_min: 15
thesis_run_time_et: 17:00
# Backtest/report governance only (no trading effect): the report refuses an
# economic PASS/FAIL verdict below this many headline-stratum trades.
min_trades_for_economic_claim: 50

# ---- P1–P3 quant signals: ALL ship flag-OFF and their full schema + defaults
# live in src/config.ts (ConfigSchema) so they need not be repeated here. Do NOT
# enable any until the paper soak has >=50 out-of-sample closed trades. Each is a
# down-only size multiplier, a fail-closed gate, or an ordering tweak; none is a
# directional vote. Groups: signals.* (anti_chase, amihud, dispersion, trend_gate,
# gap, low_vol), regime.* (trend, vol, gross), portfolio.* (sizing_mode,
# target_vol, cov_*), execution.* (cost_scalar, participation, entry_aggressiveness,
# gates_by_session — SIP-only), risk_overlay.* (drawdown_throttle, risk_off),
# calibration.*, and signal_scalar_floor. See docs/superpowers/specs. Example:
# signals:
#   anti_chase: { enabled: true }   # override just the fields you want ----
# MODEL FREEZE (soak-reset-2026-07-27, rule 1): these IDs are frozen for the
# soak evaluation window. They are fixed model IDs with no dated snapshot
# variants (verified 2026-07-27), so stationarity is enforced by rule, not by
# pinning: ANY change here resets the OOS closed-trade counter to zero.
# Per-persona overrides (model.analysts_by_name) stay unset until a paired
# backtest is registered (rule 6).
model:
  analysts: claude-sonnet-5
  synthesizer: claude-opus-4-8
  executor: claude-sonnet-5
